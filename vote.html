<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عُمان تجمعنا – التصويت لأجمل إطلالة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#fdf1e4,#f9d9c4);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:#1f3a5f}
#app{height:100dvh;max-width:980px;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px calc(4px + env(safe-area-inset-bottom));gap:6px}
.hero{flex:0 0 auto;align-self:center;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #0003;background:#9fd3f5}
.hero img{display:block;width:auto;max-width:100%;height:auto;max-height:24dvh}
.head{flex:0 0 auto;align-self:center;background:#fff8e8;border:2px dotted #e6b94a;border-radius:18px;padding:5px 18px;font-weight:800;text-align:center;font-size:clamp(14px,3.8vw,20px);box-shadow:0 3px 8px #0002;max-width:100%}
.head small{display:block;font-weight:500;font-size:clamp(11px,3vw,14px);opacity:.85}
.panel{flex:1 1 auto;min-height:0;overflow:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.ask{text-align:center;font-weight:800;font-size:clamp(15px,4vw,20px);margin:6px 0 10px}
.mini{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mt{border:0;cursor:pointer;font:inherit;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:16px 16px 28px 28px;min-width:92px;padding:12px 14px 10px;font-size:clamp(15px,4vw,20px);box-shadow:0 4px 8px #0003;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.mt small{font-weight:700;font-size:12px;opacity:.9}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.nm{font:inherit;font-weight:700;font-size:clamp(14px,3.6vw,17px);background:#fff;border:2px solid #eadccb;border-radius:14px;padding:10px 8px;cursor:pointer;color:#1f3a5f;box-shadow:0 2px 5px #0001}
.nm:active{transform:scale(.97)}
.sec{margin:0 0 12px}
.sh{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;border-radius:14px;padding:5px 12px;margin-bottom:7px;background:linear-gradient(90deg,var(--c1),var(--c2));font-size:clamp(14px,3.8vw,18px)}
.sh span{margin-inline-start:auto;font-size:12px;background:#fff3;border-radius:999px;padding:0 9px}
.cand{display:flex;align-items:center;gap:8px;text-align:start;font:inherit;font-weight:700;font-size:clamp(14px,3.6vw,17px);background:#fff;border:2px solid #eadccb;border-radius:14px;padding:7px 8px;cursor:pointer;color:#1f3a5f;box-shadow:0 2px 5px #0001}
.cand:active{transform:scale(.97)}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:linear-gradient(180deg,var(--c1),var(--c2))}
.msg{text-align:center;margin:14px auto;max-width:420px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 18px #0002;line-height:1.9;font-weight:700;font-size:clamp(15px,4vw,19px)}
.link{background:none;border:0;font:inherit;color:#1558c0;text-decoration:underline;cursor:pointer;margin-top:6px;font-size:13px}
.foot{flex:0 0 auto;display:flex;justify-content:flex-start;align-items:center;gap:8px}
#gear{background:#fff8;border:0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#6b5a48;opacity:.7;cursor:pointer}
.note{font-size:12px;background:#fff3cd;border-radius:8px;padding:2px 10px}
.ribbon{height:6px;border-radius:6px;flex:0 0 auto;background:linear-gradient(90deg,#d6212c 0 33%,#fff 33% 50%,#1b8a3a 50% 100%)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.card{background:#fff;border-radius:22px;padding:20px;width:min(92vw,400px);max-height:88dvh;overflow:auto;text-align:center;box-shadow:0 16px 40px #0005;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-size:22px;margin-bottom:6px}.card p{margin:6px 0;line-height:1.7}
.card input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #d9c9b5;border-radius:12px;margin:10px 0;text-align:center}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:10px 20px;color:#fff;cursor:pointer;margin:4px}
.btn.sec{background:#9aa3ad}
.err{color:#c0262d;font-weight:700;min-height:22px}
.adm .row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:6px 0;text-align:start;font-size:15px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:10;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105dvh) rotate(720deg)}}
@media (max-height:560px){.hero img{max-height:18dvh}}
</style>
</head>

<script>
/* ===== الإعدادات ===== */
const SUPABASE_URL = "https://qwbpowwkkazoyifdjvfn.supabase.co";
const SUPABASE_KEY = "sb_publishable_g6ei9rQk59jJNjOLQZ8aIw_3_FVxZy6"; // مفتاح عام آمن للنشر
const ADMIN_PIN    = "2026";   // رمز لوحة المعلم (زر الترس أسفل الصفحة)
/* ===================== */

const TEAMS=[
 {id:"majd",name:"المجد",c1:"#ff5a5f",c2:"#b5121b"},
 {id:"asala",name:"الأصالة",c1:"#3cc15a",c2:"#0d7a2c"},
 {id:"nahda",name:"النهضة",c1:"#b05be0",c2:"#6a1b9a"},
 {id:"oman",name:"عُمان",c1:"#ffa63d",c2:"#e0610a"},
 {id:"wala",name:"الولاء",c1:"#4aa3ff",c2:"#1558c0"}
];
const DB=!!SUPABASE_URL;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=id=>TEAMS.find(t=>t.id===id);
const H={apikey:SUPABASE_KEY,"Content-Type":"application/json"};
const rest=(p,o={})=>fetch(SUPABASE_URL+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});
const jget=p=>rest(p).then(r=>r.json());
const dj=k=>JSON.parse(localStorage.getItem(k)||"{}");

let members={}, me=null, voted=false, voting=true, pickTeam=null, myChoice=null;

/* ---- البيانات ---- */
function demoSeed(){
  if(localStorage.getItem("demoTeams")) return;
  const N=["سالم","منى","خالد","هدى","ناصر","أمل","يوسف"], all={};
  TEAMS.forEach((t,i)=>{all[t.id]={}; for(let k=0;k<4;k++) all[t.id][k]={seat:k,name:N[(i+k)%7]+" "+["الهنائي","البلوشي","الراشدي","الكندي","المعمري"][i]};});
  localStorage.setItem("demoTeams",JSON.stringify(all));
}
async function loadAll(){
  members={}; TEAMS.forEach(t=>members[t.id]=[]);
  if(DB){
    const a=await jget("seats?select=team,seat,name&order=seat"); if(!Array.isArray(a)) throw new Error("load");
    a.forEach(r=>{ if(members[r.team]) members[r.team].push(r); });
    const s=await jget("settings?k=eq.voting&select=v"); voting=!(s&&s[0]&&s[0].v===0);
  }else{
    demoSeed(); const t=dj("demoTeams");
    TEAMS.forEach(x=>members[x.id]=Object.values(t[x.id]||{}).sort((a,b)=>a.seat-b.seat));
    voting=localStorage.getItem("demoVoting")!=="0";
  }
}
async function checkVoted(){
  if(!me) return false;
  if(DB){ const r=await jget(`votes?voter_team=eq.${me.team}&voter_seat=eq.${me.seat}&select=cand_team,cand_seat`); if(Array.isArray(r)&&r[0]){ myChoice=r[0]; return true; } return false; }
  const v=dj("demoVotes")[me.team+"_"+me.seat]; if(v){ myChoice=v; return true; } return false;
}
async function castVote(c){
  if(c.team===me.team) return "same";
  if(DB){
    const r=await rest("votes",{method:"POST",body:JSON.stringify({voter_team:me.team,voter_seat:me.seat,cand_team:c.team,cand_seat:c.seat})});
    if(r.ok) return "ok"; if(r.status===409) return "dup"; if(r.status===401||r.status===403) return "closed"; return "error";
  }
  const v=dj("demoVotes"); if(v[me.team+"_"+me.seat]) return "dup";
  v[me.team+"_"+me.seat]={cand_team:c.team,cand_seat:c.seat}; localStorage.setItem("demoVotes",JSON.stringify(v)); return "ok";
}

/* ---- الواجهة ---- */
function setHead(t,s){ $("#head").innerHTML=t+(s?`<small>${s}</small>`:""); }
function render(){
  const P=$("#panel");
  const total=TEAMS.reduce((n,t)=>n+members[t.id].length,0);
  if(!DB){ $("#note").style.display="inline-block"; $("#note").textContent="وضع تجريبي: بيانات تجريبية على هذا الجهاز فقط"; }
  if(!total){ setHead("التصويت لأجمل إطلالة"); P.innerHTML=`<div class="msg">لم يسجّل أي عضو في الفرق بعد.<br>سجّل في صفحة اختيار الفرق أولًا ثم عد إلى هنا.</div>`; return; }
  if(!me){
    setHead("التصويت لأجمل إطلالة","حدّد هويتك أولًا");
    if(!pickTeam){
      P.innerHTML=`<div class="ask">اختر فريقك</div><div class="mini">${TEAMS.map(t=>`<button class="mt" data-t="${t.id}" style="--c1:${t.c1};--c2:${t.c2}">${t.name}<small>${members[t.id].length} / أعضاء</small></button>`).join("")}</div>`;
    }else{
      const t=T(pickTeam);
      P.innerHTML=`<div class="ask">اختر اسمك من فريق ${t.name}</div><div class="names">${members[t.id].map(m=>`<button class="nm" data-s="${m.seat}">${esc(m.name)}</button>`).join("")||'<div class="msg">لا يوجد أعضاء في هذا الفريق.</div>'}</div><div style="text-align:center"><button class="link" data-back="1">رجوع لاختيار الفريق</button></div>`;
    }
    return;
  }
  const mt=T(me.team);
  if(voted){
    setHead("شكرًا لمشاركتك","تم تسجيل تصويتك");
    const c=myChoice&&members[myChoice.cand_team]&&members[myChoice.cand_team].find(m=>m.seat===myChoice.cand_seat);
    P.innerHTML=`<div class="msg">تم تسجيل تصويتك بنجاح${c?`<br>تم التصويت لـ <b style="color:${T(myChoice.cand_team).c2}">${esc(c.name)}</b> من فريق ${T(myChoice.cand_team).name}`:""}.<br>لا يمكن تغيير التصويت.</div>`;
    return;
  }
  if(!voting){ setHead("التصويت لأجمل إطلالة"); P.innerHTML=`<div class="msg">التصويت مغلق حاليًا.<br>سيُعلن المعلم عن موعد فتحه.</div>`; return; }
  setHead("اختر أجمل إطلالة",`${esc(me.name)} – فريق ${mt.name} · لا يمكن التصويت لعضو من فريقك`);
  P.innerHTML=TEAMS.filter(t=>t.id!==me.team).map(t=>`<div class="sec" style="--c1:${t.c1};--c2:${t.c2}"><div class="sh">فريق ${t.name}<span>${members[t.id].length}</span></div><div class="names">${members[t.id].map(m=>`<button class="cand" data-t="${t.id}" data-s="${m.seat}"><span class="av">${esc(m.name.trim().charAt(0))}</span>${esc(m.name)}</button>`).join("")||'<div style="opacity:.7;font-size:13px">لا يوجد أعضاء</div>'}</div></div>`).join("")+`<div style="text-align:center"><button class="link" data-notme="1">لست ${esc(me.name)}؟ غيّر الهوية</button></div>`;
}
function open_(html){ $("#c").innerHTML=html; $("#m").classList.add("on"); }
function close_(){ $("#m").classList.remove("on"); }
window.close_=close_;
$("#m").addEventListener("click",e=>{if(e.target.id==="m")close_();});
function confetti(){const cols=["#d6212c","#1b8a3a","#ffc933","#fff","#4aa3ff","#b05be0"];for(let i=0;i<60;i++){const e=document.createElement("i");e.className="conf";e.style.left=Math.random()*100+"vw";e.style.background=cols[i%6];e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3400);}}

$("#panel").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.back){ pickTeam=null; return render(); }
  if(b.dataset.notme){ localStorage.removeItem("voteMe"); me=null; pickTeam=null; return render(); }
  if(b.classList.contains("mt")){ pickTeam=b.dataset.t; return render(); }
  if(b.classList.contains("nm")){
    const m=members[pickTeam].find(x=>x.seat==b.dataset.s), t=T(pickTeam);
    open_(`<h2 style="color:${t.c2}">تأكيد الهوية</h2><p>هل أنت <b>${esc(m.name)}</b> من فريق ${t.name}؟</p><button class="btn" id="yes" style="background:${t.c2}">نعم، أنا</button><button class="btn sec" onclick="close_()">لا</button>`);
    $("#yes").onclick=async()=>{ me={team:pickTeam,seat:m.seat,name:m.name}; localStorage.setItem("voteMe",JSON.stringify(me)); close_(); voted=await checkVoted().catch(()=>false); render(); };
    return;
  }
  if(b.classList.contains("cand")){
    const c={team:b.dataset.t,seat:+b.dataset.s}, m=members[c.team].find(x=>x.seat===c.seat), t=T(c.team);
    open_(`<h2 style="color:${t.c2}">تأكيد التصويت</h2><p>هل تريد التصويت لـ <b>${esc(m.name)}</b> من فريق ${t.name}؟</p><p style="font-size:14px;opacity:.8">لا يمكن تغيير التصويت بعد التأكيد.</p><div class="err" id="er"></div><button class="btn" id="ok" style="background:${t.c2}">تأكيد التصويت</button><button class="btn sec" onclick="close_()">إلغاء</button>`);
    $("#ok").onclick=async()=>{
      $("#ok").textContent="جارٍ التسجيل…"; let r; try{ r=await castVote(c);}catch(_){r="error";}
      if(r==="ok"||r==="dup"){ await checkVoted().catch(()=>{}); voted=true; if(!myChoice) myChoice={cand_team:c.team,cand_seat:c.seat}; close_(); render(); if(r==="ok") confetti(); }
      else{ $("#ok").textContent="تأكيد التصويت"; $("#er").textContent= r==="closed"?"التصويت مغلق حاليًا":"تعذّر الاتصال، حاول مرة أخرى"; }
    };
  }
});

/* ---- لوحة المعلم ---- */
$("#gear").addEventListener("click",()=>{
  open_(`<h2>لوحة المعلم</h2><p>أدخل الرمز للمتابعة</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز"><div class="err" id="pe"></div><button class="btn" id="pk" style="background:#1558c0">دخول</button><button class="btn sec" onclick="close_()">إلغاء</button>`);
  setTimeout(()=>$("#pin").focus(),50);
  const go=()=>{ if($("#pin").value!==ADMIN_PIN){ $("#pe").textContent="الرمز غير صحيح"; return; } showResults(); };
  $("#pk").onclick=go; $("#pin").onkeydown=e=>{if(e.key==="Enter")go();};
});
async function showResults(){
  let votes;
  try{ await loadAll(); votes=DB?await jget("votes?select=voter_team,voter_seat,cand_team,cand_seat"):Object.entries(dj("demoVotes")).map(([k,v])=>({voter_team:k.split("_")[0],voter_seat:+k.split("_")[1],...v})); if(!Array.isArray(votes)) throw 0; }
  catch(_){ $("#pe").textContent="تعذّر الاتصال بقاعدة البيانات"; return; }
  const cnt={}; votes.forEach(v=>{const k=v.cand_team+"_"+v.cand_seat; cnt[k]=(cnt[k]||0)+1;});
  const all=[]; TEAMS.forEach(t=>members[t.id].forEach(m=>all.push({t,m,n:cnt[t.id+"_"+m.seat]||0})));
  all.sort((a,b)=>b.n-a.n||a.m.name.localeCompare(b.m.name,"ar"));
  const total=all.length;
  open_(`<div class="adm"><h2>نتائج التصويت</h2>
   <div class="row"><span>عدد المصوِّتين</span><b>${votes.length} / ${total}</b></div>
   <div class="row"><span>حالة التصويت: <b>${voting?"مفتوح":"مغلق"}</b></span><button class="btn" id="tg" style="background:${voting?"#c0262d":"#1b8a3a"};font-size:14px;padding:6px 12px">${voting?"إغلاق التصويت":"فتح التصويت"}</button></div>
   ${all.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x.m.name)} <small style="color:${x.t.c2}">(${x.t.name})</small></span><b>${x.n}</b></div>`).join("")}
   <button class="btn" id="rs" style="background:#c0262d">تصفير الأصوات</button><button class="btn sec" onclick="close_()">إغلاق</button></div>`);
  $("#tg").onclick=async()=>{ const v=voting?0:1; if(DB) await rest("settings?k=eq.voting",{method:"PATCH",body:JSON.stringify({v})}); else localStorage.setItem("demoVoting",String(v)); await boot(); showResults(); };
  $("#rs").onclick=async()=>{ if(!confirm("سيتم حذف جميع الأصوات. متأكد؟")) return; if(DB) await rest("votes?voter_team=neq.__none__",{method:"DELETE"}); else localStorage.removeItem("demoVotes"); voted=false; myChoice=null; await boot(); close_(); };
}

/* ---- تشغيل ---- */
async function boot(){
  try{ await loadAll(); }catch(_){ $("#panel").innerHTML=`<div class="msg">تعذّر الاتصال بقاعدة البيانات.<br>تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</div>`; return; }
  if(!me){
    let s=null; try{ s=JSON.parse(localStorage.getItem("voteMe")||"null"); }catch(_){}
    if(!s){ const t=localStorage.getItem("omanTeam"), n=localStorage.getItem("omanName"); if(t&&n){ const m=(members[t]||[]).find(x=>x.name===n); if(m) s={team:t,seat:m.seat,name:m.name}; } }
    if(s&&members[s.team]&&members[s.team].some(x=>x.seat===s.seat&&x.name===s.name)) me=s;
  }
  voted=await checkVoted().catch(()=>false);
  render();
}
boot();
</script>
