<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عُمان تجمعنا – اختر فريقك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdeedd;--ink:#1f3a5f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#fdf1e4,#f9d9c4);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink)}
#app{height:100dvh;max-width:980px;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px calc(6px + env(safe-area-inset-bottom))}
.hero{flex:0 0 auto;align-self:center;max-width:100%;min-height:0;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #0003;background:#9fd3f5;display:flex;justify-content:center}
.hero img{display:block;width:auto;max-width:100%;height:auto;max-height:46dvh}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1.2dvh,12px);position:relative}
.teams{display:flex;gap:clamp(4px,1.4vw,14px);justify-content:center;align-items:flex-end;direction:rtl}
.team{flex:1 1 0;max-width:150px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:inherit;transition:transform .2s}
.team:active{transform:scale(.95)}
.team .shield{position:relative;width:100%;aspect-ratio:100/128;max-height:25dvh;animation:bob 3.4s ease-in-out infinite}
.team:nth-child(2) .shield{animation-delay:-.7s}.team:nth-child(3) .shield{animation-delay:-1.4s}.team:nth-child(4) .shield{animation-delay:-2.1s}.team:nth-child(5) .shield{animation-delay:-2.8s}
@keyframes bob{50%{transform:translateY(-4px)}}
.shield svg.bg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 5px 5px #0004)}
.shield .lbl{position:absolute;inset:30% 6% 6%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;color:#fff;font-weight:800;font-size:clamp(13px,3.9vw,26px);text-shadow:0 2px 3px #0006;line-height:1.1}
.shield .ppl{width:34%;opacity:.95}
.chip{margin-top:4px;background:#fff;border-radius:999px;padding:1px 10px;font-weight:800;font-size:clamp(12px,3.2vw,18px);box-shadow:0 2px 6px #0002;direction:ltr;min-width:52px;text-align:center}
.chip.full{background:#555;color:#fff}
.team.full{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.team.full .shield{animation:none}
.team.mine .shield{filter:drop-shadow(0 0 10px #ffd84a)}
.team.mine .chip{background:#ffd84a}
.pill{align-self:center;background:#fff8e8;border:2px dotted #e6b94a;border-radius:999px;padding:4px 16px;font-weight:700;font-size:clamp(12px,3.3vw,17px);text-align:center;box-shadow:0 3px 8px #0002}
.ribbon{height:clamp(8px,1.6dvh,14px);border-radius:8px;background:linear-gradient(90deg,#d6212c 0 33%,#fff 33% 50%,#1b8a3a 50% 100%)}
.foot{display:flex;justify-content:flex-start;padding-top:2px}
#gear{background:#fff8;border:0;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#6b5a48;opacity:.7;cursor:pointer}
.credit{text-align:center;font-size:clamp(10px,2.6vw,13px);opacity:.75;padding-top:3px;user-select:none}
.note{align-self:center;font-size:12px;background:#fff3cd;border-radius:8px;padding:2px 10px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.card{background:#fff;border-radius:22px;padding:20px;width:min(92vw,400px);max-height:88dvh;overflow:auto;text-align:center;box-shadow:0 16px 40px #0005;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-size:22px;margin-bottom:6px}.card p{margin:6px 0;line-height:1.7}
.card input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #d9c9b5;border-radius:12px;margin:10px 0;text-align:center}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:10px 20px;color:#fff;cursor:pointer;margin:4px}
.btn.sec{background:#9aa3ad}
.err{color:#c0262d;font-weight:700;min-height:22px}
.adm .row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:6px 0;text-align:start;font-size:15px}
.adm ol{padding-inline-start:20px;margin:2px 0;font-weight:500}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:10;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105dvh) rotate(720deg)}}
@media (max-width:640px){.teams{flex-wrap:wrap;row-gap:16px}.team{flex:0 0 30%;max-width:none}.team .shield{max-height:19dvh}.shield .lbl{font-size:clamp(15px,5vw,24px)}}
@media (max-height:520px){.hero img{max-height:38dvh}.shield{max-height:30dvh}}
</style>
</head>

<script>
/* ===== الإعدادات ===== */
const SUPABASE_URL = "https://qwbpowwkkazoyifdjvfn.supabase.co";
const SUPABASE_KEY = "sb_publishable_g6ei9rQk59jJNjOLQZ8aIw_3_FVxZy6"; // مفتاح عام آمن للنشر
const DEFAULT_MAX  = 7;       // عدد الأشخاص في الفريق الواحد (يمكن تغييره من لوحة المعلم)
const ADMIN_PIN    = "2026";  // رمز لوحة المعلم (زر الترس أسفل الصفحة)
/* ===================== */

const TEAMS=[
 {id:"majd",name:"المجد",c1:"#ff5a5f",c2:"#b5121b"},
 {id:"asala",name:"الأصالة",c1:"#3cc15a",c2:"#0d7a2c"},
 {id:"nahda",name:"النهضة",c1:"#b05be0",c2:"#6a1b9a"},
 {id:"oman",name:"عُمان",c1:"#ffa63d",c2:"#e0610a"},
 {id:"wala",name:"الولاء",c1:"#4aa3ff",c2:"#1558c0"}
];
const DB=!!SUPABASE_URL;
const $=s=>document.querySelector(s);
let state={}, max=DEFAULT_MAX, mine=localStorage.getItem("omanTeam"), busy=false;

/* ---- طبقة التخزين (Supabase) ---- */
const H={apikey:SUPABASE_KEY,"Content-Type":"application/json"};
const rest=(p,o={})=>fetch(SUPABASE_URL+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});
const demoGet=()=>JSON.parse(localStorage.getItem("demoTeams")||"{}");
async function load(){
  state={}; TEAMS.forEach(x=>state[x.id]=[]);
  if(DB){
    const [a,b]=await Promise.all([rest("seats?select=team,seat,name&order=seat").then(r=>r.json()),rest("settings?k=eq.max&select=v").then(r=>r.json())]);
    if(!Array.isArray(a)) throw new Error("load");
    a.forEach(r=>{ if(state[r.team]) state[r.team].push(r); });
    max=(b&&b[0]&&b[0].v)||DEFAULT_MAX;
  }else{
    const t=demoGet(); max=+localStorage.getItem("demoMax")||DEFAULT_MAX;
    TEAMS.forEach(x=>state[x.id]=Object.values(t[x.id]||{}));
  }
}
/* كل مقعد يُحجز مرة واحدة فقط (مفتاح أساسي في قاعدة البيانات)، والحد الأقصى مفروض في القاعدة نفسها */
async function claim(id,name){
  await load();
  if(state[id].length>=max) return "full";
  const taken=new Set(state[id].map(r=>+r.seat));
  for(let i=0;i<max;i++){
    if(taken.has(i)) continue;
    if(DB){
      const r=await rest("seats",{method:"POST",body:JSON.stringify({team:id,seat:i,name})});
      if(r.ok) return "ok";
      if(r.status===409) continue;               // المقعد حُجز للتو
      if(r.status===401||r.status===403) return "full"; // تجاوز الحد
      return "error";
    }else{
      const all=demoGet(); all[id]=all[id]||{}; all[id][i]={seat:i,name}; localStorage.setItem("demoTeams",JSON.stringify(all)); return "ok";
    }
  }
  return "full";
}

/* ---- الواجهة ---- */
const crown='<svg viewBox="0 0 60 34" width="38%" style="position:absolute;top:-15%;left:31%;z-index:2;filter:drop-shadow(0 2px 2px #0005)"><path d="M4 30 L8 8 L21 20 L30 3 L39 20 L52 8 L56 30 Z" fill="#ffc933" stroke="#c98a00" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="7" r="3" fill="#ffe27a"/><circle cx="30" cy="3" r="3" fill="#ffe27a"/><circle cx="52" cy="7" r="3" fill="#ffe27a"/></svg>';
const ppl='<svg class="ppl" viewBox="0 0 60 30" fill="#fff"><circle cx="30" cy="8" r="6"/><path d="M18 28c0-9 5-13 12-13s12 4 12 13z"/><circle cx="14" cy="11" r="4.5" opacity=".85"/><path d="M3 28c0-7 4-10 9-10 2 0 3 .3 4 .8-3 2-5 5-5 9.2z" opacity=".85"/><circle cx="46" cy="11" r="4.5" opacity=".85"/><path d="M57 28c0-7-4-10-9-10-2 0-3 .3-4 .8 3 2 5 5 5 9.2z" opacity=".85"/></svg>';
function render(){
  $("#teams").innerHTML=TEAMS.map(t=>{
    const n=state[t.id].length, full=n>=max, me=mine===t.id;
    return `<button class="team ${full?"full":""} ${me?"mine":""}" data-id="${t.id}" aria-label="فريق ${t.name}">
      <div class="shield">${crown}
        <svg class="bg" viewBox="0 0 100 128" preserveAspectRatio="none"><defs><linearGradient id="g${t.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.c1}"/><stop offset="1" stop-color="${t.c2}"/></linearGradient></defs>
        <path d="M8 14 Q50 2 92 14 L92 74 Q92 104 50 124 Q8 104 8 74 Z" fill="url(#g${t.id})" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
        <path d="M16 20 Q50 11 84 20" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="lbl"><span>${t.name}</span>${ppl}</div></div>
      <div class="chip ${full?"full":""}">${full?"مكتمل":n+" / "+max}</div></button>`;
  }).join("");
  const nt=$("#note");
  if(!DB){nt.style.display="block";nt.textContent="وضع تجريبي: الأعداد محفوظة على هذا الجهاز فقط (اربط قاعدة البيانات ليتشاركها الجميع)";}else nt.style.display="none";
}
function open(html){ $("#c").innerHTML=html; $("#m").classList.add("on"); }
function close(){ $("#m").classList.remove("on"); }
function confetti(){
  const cols=["#d6212c","#1b8a3a","#ffc933","#fff","#4aa3ff","#b05be0"];
  for(let i=0;i<60;i++){const e=document.createElement("i");e.className="conf";e.style.left=Math.random()*100+"vw";e.style.background=cols[i%6];e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3400);}
}
$("#teams").addEventListener("click",e=>{
  const b=e.target.closest(".team"); if(!b) return;
  const t=TEAMS.find(x=>x.id===b.dataset.id), n=state[t.id].length;
  if(mine){ const mt=TEAMS.find(x=>x.id===mine); return open(`<h2>أنت مسجّل بالفعل</h2><p>انضممت إلى فريق <b style="color:${mt.c2}">${mt.name}</b>.</p><button class="btn" style="background:${mt.c2}" onclick="close_()">حسنًا</button>`); }
  if(n>=max) return open(`<h2>الفريق مكتمل</h2><p>اكتمل عدد أعضاء فريق ${t.name}، اختر فريقًا آخر.</p><button class="btn" style="background:${t.c2}" onclick="close_()">حسنًا</button>`);
  open(`<h2 style="color:${t.c2}">فريق ${t.name}</h2><p>أدخل اسمك للانضمام</p><input id="nm" maxlength="30" placeholder="الاسم" autocomplete="off"><div class="err" id="er"></div>
    <button class="btn" id="go" style="background:${t.c2}">تأكيد الانضمام</button><button class="btn sec" onclick="close_()">إلغاء</button>`);
  setTimeout(()=>$("#nm").focus(),50);
  $("#go").onclick=async()=>{
    const name=$("#nm").value.trim(); if(name.length<2) return $("#er").textContent="يرجى كتابة اسمك";
    if(busy) return; busy=true; $("#go").textContent="جارٍ التسجيل…";
    let r; try{ r=await claim(t.id,name);}catch(_){r="error";}
    busy=false;
    if(r==="ok"){ mine=t.id; localStorage.setItem("omanTeam",t.id); localStorage.setItem("omanName",name); await load().catch(()=>{}); render(); confetti();
      open(`<h2>أحسنت يا ${name.replace(/</g,"")} 🎉</h2><p>تم انضمامك إلى فريق <b style="color:${t.c2};font-size:24px">${t.name}</b></p><button class="btn" style="background:${t.c2}" onclick="close_()">رائع</button>`);
    }else if(r==="full"){ await load().catch(()=>{}); render(); open(`<h2>عذرًا</h2><p>اكتمل فريق ${t.name} قبل لحظات، اختر فريقًا آخر.</p><button class="btn" style="background:${t.c2}" onclick="close_()">حسنًا</button>`);
    }else{ $("#go").textContent="تأكيد الانضمام"; $("#er").textContent="تعذّر الاتصال، حاول مرة أخرى"; }
  };
});
window.close_=close;
$("#m").addEventListener("click",e=>{if(e.target.id==="m")close();});

/* ---- لوحة المعلم ---- */
$("#gear").addEventListener("click",admin);
function admin(){
  open(`<h2>لوحة المعلم</h2><p>أدخل الرمز للمتابعة</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز"><div class="err" id="pe"></div><button class="btn" id="pk" style="background:#1558c0">دخول</button><button class="btn sec" onclick="close_()">إلغاء</button>`);
  setTimeout(()=>$("#pin").focus(),50);
  const go=()=>{ if($("#pin").value!==ADMIN_PIN){ $("#pe").textContent="الرمز غير صحيح"; return; } panel(); };
  $("#pk").onclick=go; $("#pin").onkeydown=e=>{if(e.key==="Enter")go();};
}
function panel(){
  load().then(()=>"ok",()=>"fail").then(res=>{ if(res==="fail"){ $("#pe").textContent="تعذّر الاتصال بقاعدة البيانات"; return; }
    open(`<div class="adm"><h2>لوحة المعلم</h2>
    <div class="row"><span>عدد الأعضاء في الفريق</span><span><input id="mx" type="number" min="1" max="100" value="${max}" style="width:80px;margin:0;padding:4px"> <button class="btn" style="background:#1558c0;font-size:14px;padding:6px 12px" id="sv">حفظ</button></span></div>
    ${TEAMS.map(t=>`<div class="row" style="display:block"><b style="color:${t.c2}">${t.name} (${state[t.id].length}/${max})</b><ol>${state[t.id].map(m=>`<li>${m.name.replace(/</g,"")}</li>`).join("")}</ol></div>`).join("")}
    <button class="btn" style="background:#c0262d" id="rs">تصفير كل الفرق</button><button class="btn sec" onclick="close_()">إغلاق</button></div>`);
    $("#sv").onclick=async()=>{const v=Math.max(1,+$("#mx").value||DEFAULT_MAX); if(DB) await rest("settings?k=eq.max",{method:"PATCH",body:JSON.stringify({v})}); else localStorage.setItem("demoMax",v); await load(); render(); close();};
    $("#rs").onclick=async()=>{ if(!confirm("سيتم حذف جميع التسجيلات. متأكد؟")) return;
      if(DB) await rest("seats?team=neq.__none__",{method:"DELETE"}); else localStorage.removeItem("demoTeams");
      localStorage.removeItem("omanTeam"); mine=null; await load(); render(); close(); };
  });
}

/* ---- تشغيل + تحديث مباشر ---- */
load().then(render).catch(()=>{TEAMS.forEach(t=>state[t.id]=[]);render();});
setInterval(()=>{ if(!busy&&!$("#m").classList.contains("on")) load().then(render).catch(()=>{}); },3000);
</script>
</body>
</html>
